name: CodeQL

# Issue #29 criterion 6. Static analysis of the TypeScript/JavaScript workspace
# on a SCHEDULE, not only PR: npm is where supply-chain attacks land, and a new
# query pack (or a newly-recognised sink) lands out-of-band against code that
# has not changed — the weekly cron is what catches it. The PR trigger keeps a
# change from regressing what the schedule already cleared.
#
# javascript-typescript covers both the TS packages and the bundled ESM the
# .mcpb ships.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload analysis SARIF to code scanning
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: javascript-typescript
          # Scope the scan to source. mcp-server/index.js is an 82k-line
          # esbuild bundle that produced 436 of 517 alerts, none actionable
          # without patching the bundler; its SOURCE stays analysed.
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          category: "/language:javascript-typescript"
